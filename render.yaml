# Render Blueprint — 骑手理赔系统后端
#
# 使用方式：
#   1. 注册 https://render.com 并连接 GitHub
#   2. New → Blueprint → 选本仓库 → render 自动读此文件
#   3. 部署完成后，把 Render 的访问地址（如 https://rider-claims-api-xxx.onrender.com）
#      填到 GitHub 仓库 Secret: VITE_API_BASE_URL
services:
  - type: web
    name: rider-claims-api
    runtime: node
    plan: free
    rootDir: backend
    region: singapore
    buildCommand: npm install && npm run db:generate
    startCommand: npm run start:prod
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: "3000"

      # 允许本地预览与 GitHub Pages 访问后端
      - key: ALLOWED_ORIGINS
        value: http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,https://googly678.github.io,https://*.github.io

      # Render 免费档无外部数据库，开启 JSON 回退模式
      - key: ALLOW_JSON_FALLBACK
        value: "true"

    autoDeploy: true